<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Monitoreo Institucional MEL — FPC</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --ink:#1E293B;
    --teal-900:#0f172a;
    --teal-800:#1E293B;
    --teal-700:#E30613;
    --teal-600:#E30613;
    --cream:#f8fafc;
    --paper:#ffffff;
    --line:#e2e8f0;
    --gold:#E30613;
    --gold-soft:#FFF0F1;
    --green:#059669;
    --green-bg:#ecfdf5;
    --amber:#d97706;
    --amber-bg:#fffbeb;
    --red:#E30613;
    --red-bg:#FFF0F1;
    --muted:#8A817C;
    --red-dark:#B8020C;
    --grey-light:#F3F2F1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:#E30613;color:#fff;}
  h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
  #app{display:flex;flex-direction:column;min-height:100vh;width:100%;}
  .topbar{
    flex:none;height:64px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;padding:0 20px;gap:16px;
  }
  .topbar img{height:40px;width:auto;display:block;}
  .topbar .sep{width:1px;height:28px;background:var(--line);flex:none;}
  .topbar .product{font-size:14px;font-weight:600;color:var(--ink);}
  .app-body{display:flex;flex:1;min-height:0;width:100%;}

  /* Sidebar */
  .sidebar{
    width:248px;flex:none;background:var(--teal-900);color:#e2e8f0;
    display:flex;flex-direction:column;padding:18px 16px;
  }
  nav.tabs{display:flex;flex-direction:column;gap:2px;}
  nav.tabs button{
    all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;font-size:14px;
    color:#cbd5e1;display:flex;align-items:center;gap:10px;transition:background .15s;
  }
  nav.tabs button:hover{background:rgba(255,255,255,.06);}
  nav.tabs button.active{background:var(--teal-700);color:#fff;font-weight:600;}
  nav.tabs .n{font-variant-numeric:tabular-nums;font-size:11px;color:#fecaca;width:16px;}
  .sidebar-foot{margin-top:auto;padding:14px 10px 4px;font-size:11.5px;color:#94a3b8;line-height:1.5;border-top:1px solid rgba(255,255,255,.12);}

  /* Main */
  main{flex:1;min-width:0;padding:30px 40px 60px;max-width:1280px;}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:20px;flex-wrap:wrap;}
  .pagehead h2{font-size:26px;margin:0 0 4px;font-weight:600;}
  .pagehead p{margin:0;color:var(--muted);font-size:14px;max-width:640px;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;}
  .grid{display:grid;gap:18px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:1fr;} .grid-2{grid-template-columns:1fr;}}

  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;}
  .kpi .label{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  .kpi .value{font-size:30px;font-weight:600;font-family:'Fraunces',serif;}
  .kpi .value.green{color:var(--green);}
  .kpi .value.amber{color:var(--amber);}
  .kpi .value.red{color:var(--red);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.02em;color:var(--muted);
    padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top;}
  tbody tr:hover{background:#f8fafc;}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper);}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;}
  .pill.green{background:var(--green-bg);color:var(--green);}
  .pill.amber{background:var(--amber-bg);color:var(--amber);}
  .pill.red{background:var(--red-bg);color:var(--red);}
  .pill.gray{background:#F3F2F1;color:#4A4441;}
  .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;}

  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;}
  input,select,textarea{
    width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:7px;font-size:13.5px;
    font-family:inherit;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-600);outline-offset:1px;border-color:var(--teal-600);}
  .field{margin-bottom:12px;}
  .btn{
    all:unset;cursor:pointer;padding:9px 16px;border-radius:7px;font-size:13.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn.primary{background:var(--red);color:#fff;}
  .btn.primary:hover{background:var(--red-dark);}
  .btn.gold{background:var(--red);color:#fff;}
  .btn.gold:hover{background:var(--red-dark);}
  .btn.ghost{background:transparent;color:var(--teal-800);border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--grey-light);}
  .btn.danger{background:transparent;color:var(--red);}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
  .toolbar .field{margin-bottom:0;min-width:170px;}
  .section-title{font-size:15px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .section-title .tag{font-size:11px;background:var(--gold-soft);color:var(--red-dark);padding:2px 8px;border-radius:5px;font-weight:600;}
  .subtle{color:var(--muted);font-size:12.5px;}
  .divider{height:1px;background:var(--line);margin:20px 0;border:none;}
  .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.60);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:26px;}
  .modal h3{margin:0 0 16px;}
  .close-x{all:unset;cursor:pointer;float:right;color:var(--muted);font-size:20px;line-height:1;}
  .empty{padding:30px;text-align:center;color:var(--muted);font-size:13.5px;}
  .flag{background:var(--gold-soft);border:1px solid #fecaca;color:var(--red-dark);font-size:12.5px;padding:10px 14px;border-radius:8px;margin-bottom:18px;}
  .chart-box{position:relative;height:280px;width:100%;}
  .chart-box canvas{display:block;width:100% !important;height:100% !important;}
  .treemap{display:flex;flex-wrap:nowrap;gap:6px;height:230px;width:100%;}
  .treemap-cell{height:100%;min-width:70px;display:flex;flex-direction:column;border-radius:6px;overflow:hidden;border:1px solid var(--line);}
  .treemap-cell-head{background:#F3F2F1;font-size:11.5px;font-weight:600;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .treemap-cell-body{flex:1;min-height:0;display:flex;flex-direction:column;}
  .treemap-seg{display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:11px;font-weight:600;line-height:1.2;padding:2px 4px;overflow:hidden;border-top:1px solid rgba(255,255,255,.25);}
  .treemap-seg:first-child{border-top:none;}
  .treemap-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;}
  .legend-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;}
  .legend-dot{width:9px;height:9px;border-radius:2px;display:inline-block;}
  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;}
  @media(max-width:1000px){.two-col{grid-template-columns:1fr;}}
  a.link{color:var(--teal-700);}
</style>
</head>

const MATRIZ_BENEFICIARIOS = {

  'Loreto':  {'Paciente':8,  'Cuidador/a':6,  'Escolar':9,  'Comunidad general':12},

  'Cusco':   {'Paciente':5,  'Cuidador/a':4,  'Comunidad general':7},
  'Piura':   {'Comunidad general':20, 'Escolar':6},
  'Puno':    {'Paciente':3,  'Cuidador/a':2},
};
const PROGRAMA_POR_TIPO = {
  'Paciente':'Atención integral, navegación y acompañamiento al paciente oncológico',
  'Cuidador/a':'Atención integral, navegación y acompañamiento al paciente oncológico',
  'Personal de salud':'Fortalecimiento de políticas públicas y sistemas de respuesta oncológica',
  'Escolar':'Promoción de la salud, prevención y detección temprana del cáncer',
  'Docente':'Promoción de la salud, prevención y detección temprana del cáncer',
  'Comunidad general':'Promoción de la salud, prevención y detección temprana del cáncer',
};
function generarBeneficiarios(){
  const filas = [];
  let id = 1;
  Object.entries(MATRIZ_BENEFICIARIOS).forEach(([region, tipos]) => {
    Object.entries(tipos).forEach(([tipo, count]) => {
      for (let k = 0; k < count; k++){
        filas.push({
          id: id++, anio:2026,
          programa: PROGRAMA_POR_TIPO[tipo] || 'Promoción de la salud, prevención y detección temprana del cáncer',
          proyecto: tipo==='Paciente'||tipo==='Cuidador/a' ? 'SEPA / Albergue Frieda Heller' : 'Estrategia comunitaria',
          region, provincia:region, distrito:region,
          tipo, sexo: k%2===0?'F':'M', edad: 18 + (k*7 % 45),
          servicio: 'Servicio FPC',
        });
      }
    });
  });
  return filas;
}

const EJE = id => DB.ejes.find(e => e.id === id);
const IND = id => DB.indicadores.find(i => i.id === id);
const USR = id => DB.usuarios.find(u => u.id === id);

function pctCumplimiento(meta, real, sentido){
  if (meta === null || meta === undefined || real === null || real === undefined || meta === '' || real === '') return null;
  meta = Number(meta); real = Number(real);
  if (sentido === 'Descendente'){
    if (real === 0) return 100;
    return Math.min(200, (meta / real) * 100);
  }
  if (meta === 0) return real > 0 ? 100 : 0;
  return (real / meta) * 100;
}

function semaforo(pct){
  if (pct === null) return {label:'Sin dato', cls:'gray'};
  if (pct >= 90) return {label:'Verde', cls:'green'};
  if (pct >= 70) return {label:'Amarillo', cls:'amber'};
  return {label:'Rojo', cls:'red'};
}

function pill(sem){
  return `<span class="pill ${sem.cls}"><span class="dot"></span>${sem.label}</span>`;
}

function fmt(n){
  if (n === null || n === undefined || n === '') return '—';
  const num = Number(n);
  if (Number.isNaN(num)) return n;
  return num % 1 === 0 ? num.toLocaleString('es-PE') : num.toLocaleString('es-PE',{maximumFractionDigits:1});
}

function esc(s){
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function computedRows(filterEjeId){
  return DB.avances
    .filter(a => a.periodo === latestPeriodo())
    .map(a => {
      const ind = IND(a.indicadorId);
      const pct = pctCumplimiento(a.metaPeriodo, a.valorReal, ind.sentido);
      return {avance:a, ind, pct, sem:semaforo(pct)};
    })
    .filter(r => !filterEjeId || r.ind.ejeId === filterEjeId);
}

function latestPeriodo(){
  const periodos = [...new Set(DB.avances.map(a=>a.periodo))];
  periodos.sort();
  return periodos[periodos.length-1] || '';
}

/* ---- Treemap (HTML/CSS, sin librerías externas) ----
   Nivel 1: región (área de la celda = participación de la región en el total)
   Nivel 2: tipo de beneficiario dentro de cada región (franjas apiladas) */
const TIPO_COLOR = {
  'Paciente':'#E30613', 'Cuidador/a':'#B8020C', 'Comunidad general':'#1E293B',
  'Escolar':'#d97706', 'Docente':'#8A817C', 'Personal de salud':'#059669',
};
function renderTreemapBenef(){
  const el = document.getElementById('treemapBenef');
  if (!el) return;

  const porRegion = {};
  DB.beneficiarios.forEach(b => {
    porRegion[b.region] = porRegion[b.region] || {};
    porRegion[b.region][b.tipo] = (porRegion[b.region][b.tipo] || 0) + 1;
  });
  const totalGeneral = DB.beneficiarios.length;
  const regiones = Object.entries(porRegion)
    .map(([region, tipos]) => ({region, tipos, total: Object.values(tipos).reduce((s,v)=>s+v,0)}))
    .sort((a,b) => b.total - a.total);

  el.innerHTML = `
    <div class="treemap">
      ${regiones.map(r => {
        const widthPct = (r.total / totalGeneral) * 100;
        const tiposOrdenados = Object.entries(r.tipos).sort((a,b)=>b[1]-a[1]);
        return `
          <div class="treemap-cell" style="flex-grow:${widthPct};flex-basis:${widthPct}%;">
            <div class="treemap-cell-head">${esc(r.region)} <span class="subtle">(${r.total})</span></div>
            <div class="treemap-cell-body">
              ${tiposOrdenados.map(([tipo, count]) => {
                const heightPct = (count / r.total) * 100;
                const showLabel = heightPct >= 14;
                return `<div class="treemap-seg" title="${esc(tipo)}: ${count}" style="height:${heightPct}%;background:${TIPO_COLOR[tipo]||'#999'};">
                  ${showLabel ? `<span>${esc(tipo)} · ${count}</span>` : ''}
                </div>`;
              }).join('')}
            </div>
          </div>`;
      }).join('')}
    </div>
    <div class="treemap-legend">
      ${Object.entries(TIPO_COLOR).filter(([t])=>DB.beneficiarios.some(b=>b.tipo===t)).map(([t,c])=>`<span class="legend-item"><span class="legend-dot" style="background:${c}"></span>${esc(t)}</span>`).join('')}
    </div>
  `;
}

let _charts = {};
function drawDashboardCharts(){
  if (typeof Chart === 'undefined') {
    setTimeout(drawDashboardCharts, 200);
    return;
  }
  Object.values(_charts).forEach(c => { try { c && c.destroy(); } catch(e) {} });
  _charts = {};
  Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
  Chart.defaults.color = '#8A817C';
  const palette = {green:'#059669', amber:'#d97706', red:'#E30613', teal:'#1E293B', gold:'#E30613', muted:'#8A817C'};
  const common = {responsive:true, maintainAspectRatio:false};

  // Barras: meta vs real por eje (acumulado del último periodo)
  const rows = computedRows();
  const byEje = DB.ejes.map(e => {
    const rs = rows.filter(r => r.ind.ejeId === e.id);
    return {
      nombre: e.codigo,
      meta: rs.reduce((s,r)=>s+Number(r.avance.metaPeriodo||0),0),
      real: rs.reduce((s,r)=>s+Number(r.avance.valorReal||0),0),
    };
  });
  const ctxBar = document.getElementById('chartBarras');
  if (ctxBar){
    _charts.barras = new Chart(ctxBar, {
      type:'bar',
      data:{
        labels: byEje.map(e=>e.nombre),
        datasets:[
          {label:'Meta', data:byEje.map(e=>e.meta), backgroundColor:palette.muted, borderRadius:4},
          {label:'Real', data:byEje.map(e=>e.real), backgroundColor:palette.gold, borderRadius:4},
        ]
      },
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true}}}
    });
  }

  // Dona: semáforo
  const counts = {green:0, amber:0, red:0};
  rows.forEach(r => { if(counts[r.sem.cls]!==undefined) counts[r.sem.cls]++; });
  const ctxDona = document.getElementById('chartDona');
  if (ctxDona){
    _charts.dona = new Chart(ctxDona, {
      type:'doughnut',
      data:{
        labels:['Verde (≥90%)','Amarillo (70–89%)','Rojo (<70%)'],
        datasets:[{data:[counts.green,counts.amber,counts.red], backgroundColor:[palette.green,palette.amber,palette.red], borderWidth:0}]
      },
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}}, cutout:'62%'}
    });
  }

  // Línea: tendencia por periodo
  const periodos = [...new Set(DB.avances.map(a=>a.periodo))].sort();
  const trend = periodos.map(p => {
    const rs = DB.avances.filter(a=>a.periodo===p).map(a => pctCumplimiento(a.metaPeriodo, a.valorReal, IND(a.indicadorId)?.sentido));
    const valid = rs.filter(v=>v!==null);
    return valid.length ? valid.reduce((s,v)=>s+v,0)/valid.length : null;
  });
  const ctxLine = document.getElementById('chartLinea');
  if (ctxLine){
    _charts.linea = new Chart(ctxLine, {
      type:'line',
      data:{labels:periodos, datasets:[{label:'% cumplimiento promedio', data:trend, borderColor:palette.gold, backgroundColor:'rgba(227,6,19,.15)', fill:true, tension:.3}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, suggestedMax:120}}}
    });
  }

  // Beneficiarios: treemap HTML (región → tipo)
  renderTreemapBenef();
}

function downloadTemplate(){
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([
    ['codigo_indicador','periodo','meta','real','comentario','responsable','fecha'],
    ['Promoción-001','2026-Q2', 5, 4, 'Ejemplo de fila — reemplazar por datos reales','Equipo Promoción','2026-07-05'],
  ]);
  XLSX.utils.book_append_sheet(wb, ws, 'Avances');
  XLSX.writeFile(wb, 'plantilla_avances.xlsx');
}

function handleImport(){
  const input = document.getElementById('fileImport');
  const file = input.files[0];
  if (!file){ importLog = 'Selecciona un archivo .xlsx primero.'; render(); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const sheetName = wb.SheetNames.find(n => n.toLowerCase().includes('avance')) || wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      let added = 0, skipped = 0;
      rows.forEach(r => {
        const codigo = String(r.codigo_indicador||r.Codigo||r['Código']||'').trim();
        const ind = DB.indicadores.find(i=>i.codigo.toLowerCase()===codigo.toLowerCase());
        if (!ind){ skipped++; return; }
        const periodo = String(r.periodo||r.Periodo||'').trim();
        if (!periodo){ skipped++; return; }
        DB.avances.push({
          id: nextId(),
          indicadorId: ind.id,
          periodo,
          anio: Number(periodo.slice(0,4)) || new Date().getFullYear(),
          metaPeriodo: Number(r.meta||r.Meta||0),
          valorReal: Number(r.real||r.Real||0),
          comentario: String(r.comentario||r.Comentario||''),
          registradoPor: DB.usuarios[0]?.id,
          fecha: String(r.fecha||r.Fecha|| new Date().toISOString().slice(0,10)),
        });
        added++;
      });
      importLog = `Importación completa: ${added} avance(s) agregado(s), ${skipped} fila(s) omitida(s) (indicador no encontrado o periodo vacío).`;
    }catch(err){
      importLog = 'No se pudo leer el archivo. Verifica que sea un .xlsx válido con la hoja "Avances".';
    }
    render();
  };
  reader.readAsArrayBuffer(file);
}

function exportAll(){
  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(DB.ejes.map(e=>({
    codigo:e.codigo, nombre:e.nombre, descripcion:e.descripcion, activo:e.activo
  }))), 'Ejes');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(DB.indicadores.map(i=>({
    codigo:i.codigo, nombre:i.nombre, eje:EJE(i.ejeId)?.codigo, tipo:i.tipo, unidad:i.unidad,
    frecuencia:i.frecuencia, metodo:i.metodo, sentido:i.sentido, fuente:i.fuente,
    responsable:USR(i.responsableId)?.nombre, activo:i.activo
  }))), 'Indicadores');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(DB.metas.map(m=>({
    codigo:IND(m.indicadorId)?.codigo, anio:m.anio, linea_base:m.lineaBase, meta_anual:m.metaAnual,
    meta_q1:m.q1, meta_q2:m.q2, meta_q3:m.q3, meta_q4:m.q4
  }))), 'Metas');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(DB.avances.map(a=>{
    const ind = IND(a.indicadorId);
    const pct = pctCumplimiento(a.metaPeriodo, a.valorReal, ind?.sentido);
    return {
      codigo:ind?.codigo, periodo:a.periodo, meta:a.metaPeriodo, real:a.valorReal,
      pct_cumplimiento: pct===null?'':Math.round(pct*10)/10, semaforo: semaforo(pct).label,
      comentario:a.comentario, responsable:USR(a.registradoPor)?.nombre, fecha:a.fecha
    };
  })), 'Avances');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(DB.beneficiarios.map(b=>({
    anio:b.anio, programa:b.programa, proyecto:b.proyecto, region:b.region, provincia:b.provincia,
    distrito:b.distrito, tipo:b.tipo, sexo:b.sexo, edad:b.edad, servicio:b.servicio
  }))), 'Beneficiarios');

  XLSX.writeFile(wb, `monitoreo_MEL_export_${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* ============================================================
   INICIO
   ============================================================ */
render();
</script>
